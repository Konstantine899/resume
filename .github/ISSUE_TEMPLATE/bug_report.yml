name: Bug report
description: Сообщить об ошибке в резюме-приложении
title: "[bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за репорт! Заполните поля — это ускорит триаж.
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: ОС, браузер, версия приложения/коммита
      placeholder: "Windows 11, Chrome 120, commit abc1234"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Описание бага
      description: Что произошло
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Шаги воспроизведения
      description: Пошагово, чтобы воспроизвести
      placeholder: |
        1. Перейти к ...
        2. Нажать ...
        3. Увидеть ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи / скриншоты
      description: Консоль, трейсы, изображения (по желанию)
