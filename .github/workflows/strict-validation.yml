name: Strict Validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Ручной запуск (инцидент-фолбэк: API-dispatch минует доставку pull_request-событий).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-validation:
    name: Strict Validation (TypeScript + ESLint)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type Check (Strict)
        run: npm run type-check:strict
        continue-on-error: false
      
      - name: Lint (Strict)
        run: npm run lint -- --format json --output-file eslint-report.json
        continue-on-error: false
      
      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate --omit=dev
        continue-on-error: false
      
      - name: Run Snyk Security Test
        if: env.SNYK_TOKEN
        run: npx snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: false

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Check bundle size against performance-budget.json
        run: npm run check:bundle

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx --yes @commitlint/cli@19 --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx --yes @commitlint/cli@19 --from "$(git merge-base origin/dev HEAD)" --to HEAD --verbose
          else
            npx --yes @commitlint/cli@19 --from "${{ github.event.before }}" --to "${{ github.event.after }}" --verbose
          fi

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      # У workflow_dispatch нет PR-скоупа у action (полная история → старые known-находки
      # падают). Сканируем диапазон ветки от merge-base с dev — семантика как на pull_request.
      - name: gitleaks (workflow_dispatch range)
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --exit-code=2 --log-opts="$(git merge-base origin/dev HEAD)..HEAD"
