name: Contract Smoke

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/shared/api/**'
      - '.github/workflows/contract-smoke.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract (frontend zod vs backend OpenAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Login to GHCR (for backend image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image
        run: docker pull ghcr.io/konstantine899/resume-api:latest

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_api
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            ghcr.io/konstantine899/resume-api:latest \
            npx prisma migrate deploy

      - name: Start backend container
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_api
          JWT_SECRET: ci-smoke-jwt-secret-at-least-32-bytes-long-aaaaaaaa
          ADMIN_EMAIL: ci@example.test
          ADMIN_PASSWORD: ci-smoke-admin-password
          FRONTEND_ORIGIN: http://localhost:3000
          SWAGGER_ENABLED: 'true'
          COOKIE_PATH: /auth
        run: |
          docker run -d --name resume-ci-backend --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NODE_ENV=development \
            -e PORT=3000 \
            -e JWT_SECRET="$JWT_SECRET" \
            -e ADMIN_EMAIL="$ADMIN_EMAIL" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e FRONTEND_ORIGIN="$FRONTEND_ORIGIN" \
            -e SWAGGER_ENABLED="$SWAGGER_ENABLED" \
            -e COOKIE_PATH="$COOKIE_PATH" \
            ghcr.io/konstantine899/resume-api:latest

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health/ready >/dev/null; then
              echo "backend ready"; exit 0;
            fi
            sleep 2;
          done
          docker logs resume-ci-backend || true
          echo "backend not ready"; exit 1

      - name: Re-snapshot OpenAPI (live check)
        run: OPENAPI_URL=http://127.0.0.1:3000/openapi.json npm run snapshot:openapi

      - name: Contract check against committed snapshot
        run: OPENAPI_URL=http://127.0.0.1:3000/openapi.json npm run check:contract

      - name: Cleanup backend container
        if: always()
        run: docker rm -f resume-ci-backend || true
