name: "CodeQL Config (resume)"

# Сканируем только первый код приложения (src).
paths:
  - src

# Исключаем тесты, фикстуры и артефакты сборки — они не несут
# продакшн-уязвимостей, а только шумят в отчёте.
paths-ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "src/tests"
  - "src/**/__tests__"
  - "**/node_modules"
  - "**/dist"
  - "**/coverage"
  - "**/*.config.ts"
  - "**/*.config.js"
