# openspec/config.yaml
# Auto-generated by sdd-init — resume project (2026-07-13)
schema: spec-driven

context: |
  Stack: React 19 + TypeScript 6.x + Vite 7.x + SCSS Modules (Dart Sass 2.x)
  Architecture: FSD (Feature-Sliced Design)
    Layers: app > pages > widgets > features > entities > shared
    Plugin: custom eslint-plugin-fsd-imports at .opencode/plugins/eslint-plugin-fsd-imports.js
  Testing: Vitest 4.x with @testing-library/react + @testing-library/user-event
  Style: SCSS Modules + CSS custom properties theming + Stylelint + Prettier

strict_tdd: true

testing:
  runner:
    name: Vitest
    command: 'npx vitest run'
    watch_command: 'npx vitest'
  layers:
    unit:
      available: true
      tool: 'Vitest + @testing-library/react + happy-dom + jsdom'
    integration:
      available: true
      tool: '@testing-library/user-event + MSW (via @vitest/browser-playwright)'
    e2e:
      available: true
      tool: 'Playwright + @vitest/browser-playwright'
  coverage:
    available: true
    command: 'npx vitest run --coverage'
    provider: v8
    thresholds:
      branches: 90
      functions: 90
      lines: 90
      statements: 90
  quality:
    linter:
      available: true
      command: 'npm run lint'
    type_checker:
      available: true
      command: 'npm run type-check'
    formatter:
      available: true
      command: 'npm run format'

rules:
  proposal:
    - Include rollback plan for risky changes
    - Define scope and impact on FSD layers
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Reference FSD layer boundaries in requirements
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect FSD import rules (layers, no circular deps, public API)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (SCSS Modules, CSS custom properties)
      - Maintain existing test coverage thresholds
      - Write tests before implementation (strict TDD mode)
      - Use existing FSD slice conventions
    tdd: true
    test_command: 'npx vitest run --reporter=verbose'
  verify:
    test_command: 'npx vitest run --coverage'
    build_command: 'npm run build'
    coverage_threshold: 90
  archive:
    - Warn before merging destructive deltas
    - Update main specs with completed change deltas
